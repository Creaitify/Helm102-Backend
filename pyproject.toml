[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helm02"
version = "0.1.0"
description = "Governed Marketing Orchestration System"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HELM Team" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "services*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "services/api/tests",
    "modules/governor/tests",
    "modules/ads/tests",
    "modules/creative/tests",
    "modules/compliance/tests",
    "modules/budget/tests",
    "modules/execution/tests",
    "modules/audit/tests",
]
pythonpath = [".", "services/api", "modules"]

